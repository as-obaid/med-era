# LoRA continued pretraining. Every arm starts from the base checkpoint and makes `epochs` passes over the
# same equal-token budget of its window (the blocks repeat; each epoch has its own seeded order).
defaults:
  precision: bf16          # bf16 (core) | qlora4 (stretch: NF4 + double quant, bf16 compute)
  lora:
    r: 16
    alpha: 32
    dropout: 0.0           # SCOPE says 0.05, but PEFT target_parameters (Gemma-EX experts) rejects
                           # dropout != 0; all arms use 0.0 so Gemma-AL vs Gemma-EX differ in one thing.
  lr: 2.0e-4
  weight_decay: 0.0
  warmup_ratio: 0.03       # linear warmup, then cosine to 0
  block_len: 2048
  micro_batch: 1
  grad_accum: 8            # 16,384 tokens per optimizer step
  max_grad_norm: 1.0
  epochs: 2                # owner decision: every adapter makes 2 passes over its equal-token budget
  seed: 42
  log_every: 10            # optimizer steps
  save_every_steps: 25     # resumable checkpoint cadence (also saved right before the deadline)
  wall_guard_hours: 7.25   # fallback when there is no Slurm end time; save and exit 3, resubmit to resume
  wall_margin_s: 300       # stop this long before the Slurm job end (SLURM_JOB_END_TIME) to save a checkpoint
  smoke_steps: 4           # optimizer steps in --smoke

arms:
  # core: bf16 LoRA on one >= 80 GB GPU per 1-h job (sharing H100, gpu-short/gpu-interactive/sharing H200),
  # resumed from checkpoints by hpc/dispatch.sh (owner decision)
  qwen:        {model: qwen35_27b,     experts: false, precision: bf16}
  gemma_al:    {model: gemma4_26b_a4b, experts: false, precision: bf16}
  gemma_ex:    {model: gemma4_26b_a4b, experts: true,  precision: bf16}
  # off-by-default switch, not part of the core: 4-bit base (fallback if H200 queues block).
  # bitsandbytes does not quantize the fused experts, so they stay bf16; the audit records dtypes.
  qwen_q4:     {model: qwen35_27b,     experts: false, precision: qlora4, stretch: true}
  gemma_al_q4: {model: gemma4_26b_a4b, experts: false, precision: qlora4, stretch: true}
  gemma_ex_q4: {model: gemma4_26b_a4b, experts: true,  precision: qlora4, stretch: true}
