[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medera"
version = "0.1.0"
description = "Studying how LoRA/QLoRA training on medical literature from different eras shifts LLM responses."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Muhammad Obaidullah", email = "abdulsalam.m@northeastern.edu" }]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "requests>=2.31", "numpy>=1.26"]

[project.optional-dependencies]
train = [
  "torch==2.6.0",
  "transformers==5.12.1",
  "peft==0.19.1",
  "accelerate==1.14.0",
  "bitsandbytes==0.49.2",
  "flash-linear-attention==0.5.1",
]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
