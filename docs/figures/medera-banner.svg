<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">MedEra: Temporal Adaptation of Medical LLMs</title>
  <desc id="d">Title banner for MedEra, a case study of hormone replacement therapy (HRT) for menopause. It asks whether a model's clinical answers follow the era of literature it read. Models: Qwen3.5-27B (dense) and Gemma-4-26B-A4B (mixture of experts). Diagram: a base model forks into three lanes; in each lane the same model is adapted with LoRA on one era of Europe PMC open-access literature (w1 2011–2015, w2 2016–2020, w3 2021–2026). A single bar spanning the lanes marks the same question put to every adapted model. Each answer is drawn only as a question mark, and a bracket asks whether the answers shift in era order. No results are shown.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1B2330; }
      .slate { fill: #4B5563; }
      .muted { fill: #6B7280; }
      .blue { fill: #18539D; }
      .eyebrow { font-size: 17px; font-weight: 600; letter-spacing: 2.2px; fill: #18539D; }
      .ln { fill: none; stroke: #A7B0BC; stroke-width: 1.5; stroke-linecap: round; }
    </style>
    <clipPath id="card"><rect width="1280" height="640" rx="20"/></clipPath>
    <linearGradient id="stripe" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9CBCE3"/>
      <stop offset="0.5" stop-color="#4F86CB"/>
      <stop offset="1" stop-color="#18539D"/>
    </linearGradient>
    <linearGradient id="wm" x1="268" y1="102" x2="420" y2="178" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F86CB"/>
      <stop offset="1" stop-color="#18539D"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="172" x2="0" y2="228" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F86CB"/>
      <stop offset="1" stop-color="#18539D"/>
    </linearGradient>
    <linearGradient id="era" x1="0" y1="250" x2="0" y2="502" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9CBCE3"/>
      <stop offset="0.5" stop-color="#4F86CB"/>
      <stop offset="1" stop-color="#18539D"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="640" fill="#FCFCFB"/>
    <rect width="1280" height="5" fill="url(#stripe)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="639" rx="19.5" fill="none" stroke="#DCE1E7"/>

  <!-- title block -->
  <text x="64" y="76" class="eyebrow">CASE STUDY · HRT FOR MENOPAUSE</text>
  <text x="59" y="178" font-size="108" font-weight="700" letter-spacing="-3">Med<tspan fill="url(#wm)">Era</tspan></text>
  <text x="63" y="222" font-size="29" font-weight="500" class="slate">Temporal Adaptation of Medical LLMs</text>

  <!-- models -->
  <text x="708" y="76" class="eyebrow">MODELS</text>
    <rect x="708" y="102" width="229" height="36" rx="18.0" fill="#FFFFFF" stroke="#DCE1E7" stroke-width="1.25"/>
    <rect x="722" y="114.0" width="12" height="12" rx="3" fill="#1B2330"/>
    <text x="744" y="126" font-size="17"><tspan font-weight="700">Qwen3.5-27B</tspan><tspan class="muted" dx="7">·</tspan><tspan class="muted" dx="7">dense</tspan></text>
    <rect x="947" y="102" width="269" height="36" rx="18.0" fill="#FFFFFF" stroke="#DCE1E7" stroke-width="1.25"/>
    <rect x="961" y="114.0" width="5" height="5" rx="1.25" fill="#1B2330"/><rect x="961" y="121.0" width="5" height="5" rx="1.25" fill="#1B2330"/><rect x="968" y="114.0" width="5" height="5" rx="1.25" fill="#1B2330"/><rect x="968" y="121.0" width="5" height="5" rx="1.25" fill="#1B2330"/>
    <text x="983" y="126" font-size="17"><tspan font-weight="700">Gemma-4-26B-A4B</tspan><tspan class="muted" dx="7">·</tspan><tspan class="muted" dx="7">MoE</tspan></text>

  <!-- tagline -->
  <rect x="708" y="172" width="3" height="56" rx="1.5" fill="url(#rule)"/>
  <g font-size="24" font-weight="500">
    <text x="728" y="190">Do a model’s clinical answers</text>
    <text x="728" y="222">follow the era it read?</text>
  </g>

  <g transform="translate(0 61)">

  <!-- one base model -->
    <rect x="76" y="344" width="64" height="64" rx="16" fill="#1B2330"/>
    <path d="M 97 362 L 119 369 M 97 362 L 119 383 M 97 376 L 119 369 M 97 376 L 119 383 M 97 390 L 119 369 M 97 390 L 119 383" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <circle cx="97" cy="362" r="4.25" fill="#FFFFFF"/>
    <circle cx="97" cy="376" r="4.25" fill="#FFFFFF"/>
    <circle cx="97" cy="390" r="4.25" fill="#FFFFFF"/>
    <circle cx="119" cy="369" r="4.25" fill="#FFFFFF"/>
    <circle cx="119" cy="383" r="4.25" fill="#FFFFFF"/>
  <text x="108.0" y="438" font-size="17" class="slate" text-anchor="middle">Base model</text>

  <!-- fork: everything fixed except the era -->
  <line x1="150" y1="376" x2="166" y2="376" class="ln"/>
  <path d="M 166 376 C 242.0 376 242.0 278 308 278" class="ln"/>
  <line x1="166" y1="376" x2="308" y2="376" class="ln"/>
  <path d="M 166 376 C 242.0 376 242.0 474 308 474" class="ln"/>
  <circle cx="166" cy="376" r="3.5" fill="#A7B0BC"/>

  <text x="318" y="239" font-size="17" class="slate">LoRA on one era’s Europe PMC literature</text>

  <!-- lane w1 -->
  <rect x="318" y="255" width="212" height="46" rx="12" fill="#FFFFFF" stroke="#DCE1E7" stroke-width="1.25"/>
    <path d="M 336 269 a 2 2 0 0 1 2 -2 h 9 l 6 6 v 14 a 2 2 0 0 1 -2 2 h -13 a 2 2 0 0 1 -2 -2 z" fill="#9CBCE3"/>
    <path d="M 347 267 v 4 a 2 2 0 0 0 2 2 h 4" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="370" y="285" font-size="20"><tspan font-weight="700">w1</tspan><tspan class="slate" dx="10">2011–2015</tspan></text>
  <line x1="540" y1="278" x2="624" y2="278" class="ln"/>
    <rect x="634" y="246" width="64" height="64" rx="16" fill="#9CBCE3"/>
    <path d="M 655 264 L 677 271 M 655 264 L 677 285 M 655 278 L 677 271 M 655 278 L 677 285 M 655 292 L 677 271 M 655 292 L 677 285" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <circle cx="655" cy="264" r="4.25" fill="#FFFFFF"/>
    <circle cx="655" cy="278" r="4.25" fill="#FFFFFF"/>
    <circle cx="655" cy="292" r="4.25" fill="#FFFFFF"/>
    <circle cx="677" cy="271" r="4.25" fill="#FFFFFF"/>
    <circle cx="677" cy="285" r="4.25" fill="#FFFFFF"/>
  <line x1="708" y1="278" x2="792" y2="278" class="ln"/>
  <line x1="828" y1="278" x2="912" y2="278" class="ln"/>
  <path d="M 936 250 H 996 A 14 14 0 0 1 1010 264 V 292 A 14 14 0 0 1 996 306 H 952 L 938 317 L 940 306 H 936 A 14 14 0 0 1 922 292 V 264 A 14 14 0 0 1 936 250 Z" fill="#FFFFFF" stroke="#9CBCE3" stroke-width="2" stroke-linejoin="round"/>
  <text x="966.0" y="288" font-size="28" font-weight="600" class="slate" text-anchor="middle">?</text>

  <!-- lane w2 -->
  <rect x="318" y="353" width="212" height="46" rx="12" fill="#FFFFFF" stroke="#DCE1E7" stroke-width="1.25"/>
    <path d="M 336 367 a 2 2 0 0 1 2 -2 h 9 l 6 6 v 14 a 2 2 0 0 1 -2 2 h -13 a 2 2 0 0 1 -2 -2 z" fill="#4F86CB"/>
    <path d="M 347 365 v 4 a 2 2 0 0 0 2 2 h 4" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="370" y="383" font-size="20"><tspan font-weight="700">w2</tspan><tspan class="slate" dx="10">2016–2020</tspan></text>
  <line x1="540" y1="376" x2="624" y2="376" class="ln"/>
    <rect x="634" y="344" width="64" height="64" rx="16" fill="#4F86CB"/>
    <path d="M 655 362 L 677 369 M 655 362 L 677 383 M 655 376 L 677 369 M 655 376 L 677 383 M 655 390 L 677 369 M 655 390 L 677 383" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <circle cx="655" cy="362" r="4.25" fill="#FFFFFF"/>
    <circle cx="655" cy="376" r="4.25" fill="#FFFFFF"/>
    <circle cx="655" cy="390" r="4.25" fill="#FFFFFF"/>
    <circle cx="677" cy="369" r="4.25" fill="#FFFFFF"/>
    <circle cx="677" cy="383" r="4.25" fill="#FFFFFF"/>
  <line x1="708" y1="376" x2="792" y2="376" class="ln"/>
  <line x1="828" y1="376" x2="912" y2="376" class="ln"/>
  <path d="M 936 348 H 996 A 14 14 0 0 1 1010 362 V 390 A 14 14 0 0 1 996 404 H 952 L 938 415 L 940 404 H 936 A 14 14 0 0 1 922 390 V 362 A 14 14 0 0 1 936 348 Z" fill="#FFFFFF" stroke="#4F86CB" stroke-width="2" stroke-linejoin="round"/>
  <text x="966.0" y="386" font-size="28" font-weight="600" class="slate" text-anchor="middle">?</text>

  <!-- lane w3 -->
  <rect x="318" y="451" width="212" height="46" rx="12" fill="#FFFFFF" stroke="#DCE1E7" stroke-width="1.25"/>
    <path d="M 336 465 a 2 2 0 0 1 2 -2 h 9 l 6 6 v 14 a 2 2 0 0 1 -2 2 h -13 a 2 2 0 0 1 -2 -2 z" fill="#18539D"/>
    <path d="M 347 463 v 4 a 2 2 0 0 0 2 2 h 4" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="370" y="481" font-size="20"><tspan font-weight="700">w3</tspan><tspan class="slate" dx="10">2021–2026</tspan></text>
  <line x1="540" y1="474" x2="624" y2="474" class="ln"/>
    <rect x="634" y="442" width="64" height="64" rx="16" fill="#18539D"/>
    <path d="M 655 460 L 677 467 M 655 460 L 677 481 M 655 474 L 677 467 M 655 474 L 677 481 M 655 488 L 677 467 M 655 488 L 677 481" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <circle cx="655" cy="460" r="4.25" fill="#FFFFFF"/>
    <circle cx="655" cy="474" r="4.25" fill="#FFFFFF"/>
    <circle cx="655" cy="488" r="4.25" fill="#FFFFFF"/>
    <circle cx="677" cy="467" r="4.25" fill="#FFFFFF"/>
    <circle cx="677" cy="481" r="4.25" fill="#FFFFFF"/>
  <line x1="708" y1="474" x2="792" y2="474" class="ln"/>
  <line x1="828" y1="474" x2="912" y2="474" class="ln"/>
  <path d="M 936 446 H 996 A 14 14 0 0 1 1010 460 V 488 A 14 14 0 0 1 996 502 H 952 L 938 513 L 940 502 H 936 A 14 14 0 0 1 922 488 V 460 A 14 14 0 0 1 936 446 Z" fill="#FFFFFF" stroke="#18539D" stroke-width="2" stroke-linejoin="round"/>
  <text x="966.0" y="484" font-size="28" font-weight="600" class="slate" text-anchor="middle">?</text>

  <!-- the same question for every model -->
  <text x="802" y="239" font-size="17" class="slate">Same question</text>
  <rect x="802" y="255" width="16" height="242" rx="8.0" fill="#1B2330"/>
  <circle cx="810.0" cy="278" r="3.25" fill="#FFFFFF"/>
  <circle cx="810.0" cy="376" r="3.25" fill="#FFFFFF"/>
  <circle cx="810.0" cy="474" r="3.25" fill="#FFFFFF"/>

  <!-- bracket: do the answers shift in era order? -->
  <path d="M 1048 250 H 1058 V 502 H 1048 M 1058 376 H 1068" fill="none" stroke="url(#era)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-size="24" font-weight="600">
    <text x="1084" y="370">Shift in</text>
    <text x="1084" y="400" class="blue">era order?</text>
  </g>

  </g>
</svg>
